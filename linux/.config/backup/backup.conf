# backup.sh configuration — sourced as bash.
# Linked to ~/.config/backup/backup.conf by install.sh.

# Where snapshots are written. Point this at an external drive for real
# protection; a backup on the same disk only survives mistakes, not failure.
BACKUP_ROOT="$HOME/Backups"

# Number of snapshots to keep (oldest pruned first). 0 = keep everything.
KEEP_SNAPSHOTS=7

# Set to 1 when BACKUP_ROOT is a removable/external drive: the timer will
# skip the run instead of writing into an unmounted mountpoint.
REQUIRE_MOUNT=0

# Extra rsync excludes, relative to $HOME. One per line.
# EXTRA_EXCLUDES=(
#   "VirtualBox VMs/"
#   "Games/"
# )
