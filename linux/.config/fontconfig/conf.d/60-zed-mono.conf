<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Make ZedMono Nerd Font the default monospace family for all apps. -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>ZedMono Nerd Font</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>ZedMono Nerd Font</string>
    </edit>
  </match>

  <!-- Prefer the Nerd Font symbol fallback for icon glyphs. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>ZedMono Nerd Font</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
