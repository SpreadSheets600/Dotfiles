# =============================================================================
#  kitty.conf — terminal heaven
#  Managed in ~/Dotfiles/linux/.config/kitty/kitty.conf
#
#  Colours and tab styling are generated by DankMaterialShell / ii into
#  dank-theme.conf and dank-tabs.conf, so the terminal follows the wallpaper.
# =============================================================================

include dank-theme.conf
include dank-tabs.conf

# --- Font ---------------------------------------------------------------------
font_family      ZedMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
adjust_line_height 105%
disable_ligatures never

# --- Cursor -------------------------------------------------------------------
cursor_shape              block
cursor_blink_interval     0.5
cursor_stop_blinking_after 15
cursor_trail              2
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2

# --- Window -------------------------------------------------------------------
window_padding_width      16
window_margin_width       0
hide_window_decorations   yes
confirm_os_window_close   0
placement_strategy        center
background_opacity        0.96
dynamic_background_opacity yes
background_blur           24

# --- Tabs ---------------------------------------------------------------------
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_align         left
tab_bar_min_tabs      2
tab_title_template    "{fmt.fg.tab}{bell_symbol}{activity_symbol}{title[:30]}{title[30:] and '…'}"
active_tab_title_template "{fmt.fg.tab}{bell_symbol}{activity_symbol}{title[:30]}{title[30:] and '…'}"

# --- Behaviour ----------------------------------------------------------------
scrollback_lines         20000
copy_on_select           clipboard
strip_trailing_spaces    smart
mouse_hide_wait          2.0
enable_audio_bell        no
visual_bell_duration     0.0
window_alert_on_bell     no
update_check_interval    0
shell_integration        enabled
allow_remote_control     yes
listen_on                unix:/tmp/kitty-$USER
focus_follows_mouse      no

# --- Shell --------------------------------------------------------------------
shell /usr/bin/zsh

# --- Key bindings -------------------------------------------------------------
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+c              copy_or_interrupt
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+n        new_window_with_cwd
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+w        close_window
map ctrl+plus           change_font_size all +0.5
map ctrl+equal          change_font_size all +0.5
map ctrl+kp_add         change_font_size all +0.5
map ctrl+minus          change_font_size all -0.5
map ctrl+underscore     change_font_size all -0.5
map ctrl+kp_subtract    change_font_size all -0.5
map ctrl+0              change_font_size all 0
map ctrl+kp_0           change_font_size all 0
map page_up             scroll_page_up
map page_down           scroll_page_down
map ctrl+shift+f        search_scrollback
