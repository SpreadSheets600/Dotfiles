# =============================================================================
#  ~/.config/paru/paru.conf — AUR helper defaults
#  Managed in ~/Dotfiles/linux/.config/paru/paru.conf
#  See: man paru.conf
# =============================================================================

[options]
PgpFetch          # import missing PGP keys automatically
Devel             # track -git/-svn/... development packages
Provides          # search providers when resolving dependencies
CombinedUpgrade   # upgrade repo + AUR packages in one run
UpgradeMenu       # show a selectable upgrade list
NewsOnUpgrade     # show Arch news before a full upgrade
SudoLoop          # keep sudo alive during long AUR builds
BatchInstall      # ask once for a batch of packages
UseAsk            # use pacman-style confirmation
CleanAfter        # remove build dependencies after installing
