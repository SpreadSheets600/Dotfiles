# =============================================================================
#  ~/.config/paru/paru.conf — AUR helper defaults
#  Managed in ~/Dotfiles/linux/.config/paru/paru.conf
#  See: man paru.conf
#
#  NOTE: paru.conf supports NO inline (trailing) comments. Every option must
#  occupy its own line; a "# ..." after an option becomes part of the name and
#  paru fails with "unknown option ... in section [options]".
# =============================================================================

[options]
# Import missing PGP keys automatically
PgpFetch
# Track -git/-svn/... development packages
Devel
# Search providers when resolving dependencies
Provides
# Upgrade repo + AUR packages in one run
CombinedUpgrade
# Show a selectable upgrade list
UpgradeMenu
# Show Arch news before a full upgrade
NewsOnUpgrade
# Keep sudo alive during long AUR builds
SudoLoop
# Ask once for a batch of packages
BatchInstall
# Use pacman-style confirmation
UseAsk
# Remove build dependencies after installing
CleanAfter
